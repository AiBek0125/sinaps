# Конфигурация деплоя Netlify для PWA «Синапс»

[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

# Маршрут /api/ask перенаправляется в серверлес-функцию api/ask.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback для остальных путей
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Заголовки кэширования для Service Worker и статики
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
