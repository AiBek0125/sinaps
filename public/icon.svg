<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#302854"/>
      <stop offset="100%" stop-color="#17142b"/>
    </radialGradient>
    <linearGradient id="head" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#faf7ff"/>
      <stop offset="55%" stop-color="#ece5f7"/>
      <stop offset="100%" stop-color="#d8cef0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34335c"/>
      <stop offset="100%" stop-color="#22213d"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#a8fff0"/>
      <stop offset="65%" stop-color="#6ce8d6"/>
      <stop offset="100%" stop-color="#3bc9db"/>
    </radialGradient>
    <radialGradient id="bulb" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="60%" stop-color="#ffd27f"/>
      <stop offset="100%" stop-color="#f2a944"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="280" r="175" fill="#7c6be6" opacity="0.16"/>
  <!-- Антенна -->
  <rect x="247" y="76" width="18" height="48" rx="9" fill="#d9cef0"/>
  <circle cx="256" cy="68" r="26" fill="url(#bulb)"/>
  <!-- Голова -->
  <rect x="106" y="114" width="300" height="232" rx="110" fill="url(#head)"/>
  <!-- Экран лица -->
  <rect x="138" y="148" width="236" height="160" rx="76" fill="url(#screen)"/>
  <!-- Румянец -->
  <ellipse cx="174" cy="252" rx="22" ry="12" fill="#ffb3c1" opacity="0.72"/>
  <ellipse cx="338" cy="252" rx="22" ry="12" fill="#ffb3c1" opacity="0.72"/>
  <!-- Глаза -->
  <circle cx="204" cy="222" r="28" fill="url(#eye)"/>
  <circle cx="308" cy="222" r="28" fill="url(#eye)"/>
  <circle cx="195" cy="211" cy-r="9" r="9" fill="#ffffff"/>
  <circle cx="299" cy="211" r="9" fill="#ffffff"/>
  <!-- Улыбка -->
  <path d="M 228 258 Q 256 280 284 258" fill="none" stroke="#7ef9e0" stroke-width="11" stroke-linecap="round"/>
  <!-- Маленькое тельце -->
  <rect x="190" y="346" width="132" height="86" rx="43" fill="url(#head)"/>
  <circle cx="256" cy="390" r="18" fill="#7ef9e0" opacity="0.7"/>
  <!-- Ручки -->
  <ellipse cx="152" cy="382" rx="24" ry="34" transform="rotate(20 152 382)" fill="url(#head)"/>
  <ellipse cx="360" cy="382" rx="24" ry="34" transform="rotate(-20 360 382)" fill="url(#head)"/>
</svg>
